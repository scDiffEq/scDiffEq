# Runs the offline test suite on pull requests.
#
# Network-dependent and multi-GB dataset tests are marked `slow` and excluded by
# default (see `addopts` in pyproject.toml); run them locally with `pytest -m slow`.
name: Tests

on:
  # No branch filter: stacked pull requests target another feature branch rather
  # than main, and would otherwise get no CI at all.
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Run tests
        run: >
          uv run
          --python ${{ matrix.python-version }}
          --extra test
          pytest tests -v
