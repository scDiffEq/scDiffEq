[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/scdiffeq/__version__.py"
pattern = "__version__ = \"(?P<version>.*)\""

[project]
name = "scdiffeq"
dynamic = ["version"]
description = "scDiffEq: modeling single-cell dynamics using neural differential equations."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Michael E. Vinyard", email = "mvinyard.ai@gmail.com"}
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3.11",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.5.0",
    "lightning>=2.1",
    "pykeops>=2.1.2",
    "geomloss>=0.2.6",
    "torchsde>=0.2.6",
    "ABCParse>=0.1.4",
    "adata-query>=0.1.0",
    "cell-neighbors>=0.1.0",
    "neural-diffeqs>=0.3.2",
    "torch-nets>=0.1.0",
    "torch-adata>=0.1.1",
    "autodevice>=0.0.2",
    "cellplots>=0.0.1rc0",
    "cell-perturb>=0.0.1rc1",
    "tqdm",
    "anndata>=0.11.3",
    "scanpy>=1.11.0",
    "requests",
    # Imported at module scope by scdiffeq itself. These were previously
    # satisfied only transitively (via scanpy/anndata/lightning), which works
    # until an upstream drops one -- exactly how pandas 3.0 moving pytz to an
    # optional extra made `import scdiffeq` fail through a transitive dependency.
    "scikit-learn>=1.5",
    "h5py>=3.8",
    "numpy",
    "pandas",
    "scipy",
    "matplotlib",
    "statsmodels",
    "pyyaml",
    "plotly",
]

[project.optional-dependencies]
docs = [
    "numpy<2.0",
    "scikit-learn>=1.5",
    "sphinx",
    "autodoc",
    "sphinxcontrib-napoleon",
    "nbsphinx",
    "ipython",
    "sphinx-autodoc-typehints",
    "pydata-sphinx-theme",
    "sphinx-copybutton",
    "sphinx-design",
    "sphinx-favicon",
    "myst-parser",
]
# Imported lazily, inside the functions that need them, so the package works
# without them until you use the corresponding feature.
optional = [
    "umap-learn",  # datasets: UMAP during unprocessed-variant preprocessing
    "pillow",  # plotting: simulation GIFs
    "ipython",  # notebook-aware progress bars and loss display
    "psutil",  # MemoryMonitor callback
    "wandb",  # MemoryMonitor logging to Weights & Biases
]
test = [
    "pytest>=8.0",
]
dev = [
    "jupyter",
    "jupyterlab",
    "ipykernel>=7.1.0",
    "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/scDiffEq/scDiffEq"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "slow: tests that download multi-GB datasets over the network",
]
# Network/multi-GB tests are opt-in: run them with `pytest -m slow`.
addopts = "-m 'not slow'"
